name: W2 B5 forecaster
on:
  workflow_dispatch:
    inputs:
      budget_minutes: {description: "minutes this run", default: "230"}
permissions: {contents: write}
concurrency: {group: b5, cancel-in-progress: false}
jobs:
  b5:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q "pandas==3.0.2" numpy pyarrow scipy scikit-learn requests
      - name: cache wide table
        uses: actions/cache@v4
        with:
          path: |
            bf_vantage_ALL_wide.parquet
            bf_vantage_ALL_mf.parquet
          key: wide-v1
      - name: build wide table if missing
        run: |
          if [ ! -f bf_vantage_ALL_wide.parquet ]; then
            mkdir -p data
            python fetch_arch.py BTCUSDT 2017 8
            python fetch_arch.py ETHUSDT 2017 8
            python fetch_arch.py SOLUSDT 2020 8
            python fetch_arch.py XRPUSDT 2018 5
            python b1t2_mf.py
            python b_join.py
          fi
      - run: python b5.py --budget-min ${{ github.event.inputs.budget_minutes }}
      - name: commit results
        run: |
          git config user.name "b5-bot"; git config user.email "bot@none"
          git add b5_state.json b5_scores.csv || true
          git commit -m "b5 chunk [skip ci]" || echo "nothing to commit"
          git pull --rebase || true
          git push
